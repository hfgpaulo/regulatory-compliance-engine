# Orquestração local: MongoDB e o motor Go. O gateway PHP entra em um bloco
# posterior. Para desenvolver com hot reload, suba só o MongoDB (make dev).
services:
  mongodb:
    image: mongo:7
    container_name: regulatory-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      # Credenciais de desenvolvimento (nao-secretas). Em produção viriam de
      # variáveis de ambiente / secrets manager.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  regulatory-engine:
    build: ./regulatory-engine
    container_name: regulatory-engine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Dentro da rede do compose o Mongo é alcançado pelo nome do serviço.
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017
      MONGO_DB: regulatory
    depends_on:
      # O motor é fail-fast sem banco: só sobe depois do Mongo ficar healthy.
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
