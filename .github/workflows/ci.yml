name: CI

# Roda a verificação em uma máquina limpa a cada push na main e em todo PR.
# É a mesma sequência que se roda localmente (fmt, build, vet, test), mas num
# ambiente do zero: pega arquivo esquecido no commit, go.sum inconsistente ou
# código não formatado antes de entrar na main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # MongoDB real para os testes de integração do repositório (acessível em
    # localhost:27017 a partir dos passos do job).
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # O módulo Go mora em regulatory-engine/, não na raiz do repositório
    # (monorepo poliglota). Todos os passos abaixo rodam dentro dessa pasta.
    defaults:
      run:
        working-directory: regulatory-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          # Cache de módulos embutido; usa o go.sum do módulo como chave.
          cache: true
          cache-dependency-path: regulatory-engine/go.sum

      # Formatação: gofmt -l lista os arquivos fora do padrão. Se listar algo,
      # falha o job (boa prática: formatação não é opinião, é padrão da linguagem).
      - name: Check formatting (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Arquivos fora do padrao gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Com MONGO_TEST_URI definida, os testes de integração do repositório
      # rodam contra o service container (sem ela, eles se pulam).
      - name: Test
        env:
          MONGO_TEST_URI: mongodb://admin:admin123@localhost:27017
        run: go test ./...

  # Job paralelo: garante que o Dockerfile continua construindo a imagem.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t regulatory-engine:ci regulatory-engine

  # Gateway legado (PHP): análise estática, testes e build da imagem.
  gateway:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: legacy-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Test (PHPUnit)
        run: vendor/bin/phpunit

      - name: Build image
        run: docker build -t legacy-gateway:ci .