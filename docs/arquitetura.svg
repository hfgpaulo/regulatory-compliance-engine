<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#1F3864"/>
    </marker>
  </defs>

  <!-- outer: docker-compose -->
  <rect x="15" y="15" width="870" height="570" rx="12" fill="#ffffff" stroke="#9fb0c9" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="450" y="42" text-anchor="middle" font-size="15" fill="#5b6b85" font-style="italic">docker-compose</text>

  <!-- legacy-gateway (bloco futuro: borda tracejada) -->
  <rect x="55" y="70" width="330" height="225" rx="10" fill="#f7f9fc" stroke="#1F3864" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="75" y="105" font-size="19" font-weight="bold" fill="#1F3864">legacy-gateway</text>
  <text x="75" y="127" font-size="13" fill="#5b6b85">PHP 8 + Slim</text>
  <text x="75" y="146" font-size="12.5" fill="#5b6b85" font-style="italic">(bloco futuro)</text>
  <text x="75" y="185" font-size="14" fill="#1a1a1a">•  intake de produto</text>
  <text x="75" y="213" font-size="14" fill="#1a1a1a">•  orquestra a chamada</text>
  <text x="75" y="241" font-size="14" fill="#1a1a1a">•  expõe o relatório</text>

  <!-- regulatory-engine -->
  <rect x="515" y="70" width="330" height="225" rx="10" fill="#eef2f9" stroke="#1F3864" stroke-width="1.6"/>
  <text x="535" y="105" font-size="19" font-weight="bold" fill="#1F3864">regulatory-engine</text>
  <text x="535" y="127" font-size="13" fill="#5b6b85">Go 1.25 + Fiber v3</text>
  <text x="535" y="160" font-size="14" fill="#1a1a1a">•  motor de regras</text>
  <text x="535" y="186" font-size="14" fill="#1a1a1a">•  domínios regulatórios</text>
  <text x="535" y="212" font-size="14" fill="#1a1a1a">•  gera "gap report"</text>
  <text x="535" y="238" font-size="14" fill="#1a1a1a">•  persiste avaliações</text>
  <text x="535" y="264" font-size="14" fill="#1a1a1a">•  regras configuráveis</text>

  <!-- arrows between services (integração planejada: tracejadas) -->
  <text x="450" y="150" text-anchor="middle" font-size="12.5" fill="#5b6b85">HTTP / REST</text>
  <line x1="388" y1="163" x2="512" y2="163" stroke="#1F3864" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <line x1="512" y1="205" x2="388" y2="205" stroke="#1F3864" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="450" y="228" text-anchor="middle" font-size="12.5" fill="#5b6b85">JSON</text>

  <!-- engine -> data stores (implementado: setas sólidas, saindo do engine) -->
  <line x1="650" y1="298" x2="500" y2="406" stroke="#1F3864" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="710" y1="298" x2="735" y2="406" stroke="#1F3864" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- MongoDB -->
  <rect x="375" y="410" width="225" height="100" rx="10" fill="#f7f9fc" stroke="#1F3864" stroke-width="1.6"/>
  <text x="487" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3864">MongoDB</text>
  <text x="487" y="477" text-anchor="middle" font-size="12" fill="#5b6b85">avaliações (request + report)</text>

  <!-- rules.json -->
  <rect x="625" y="410" width="225" height="100" rx="10" fill="#f7f9fc" stroke="#1F3864" stroke-width="1.6"/>
  <text x="737" y="452" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F3864">rules.json</text>
  <text x="737" y="477" text-anchor="middle" font-size="12" fill="#5b6b85">parametrização regulatória</text>

  <!-- legenda: solida = implementado, tracejada = planejado -->
  <line x1="60" y1="545" x2="92" y2="545" stroke="#1F3864" stroke-width="1.8"/>
  <text x="100" y="549" font-size="12" fill="#5b6b85">implementado</text>
  <line x1="215" y1="545" x2="247" y2="545" stroke="#1F3864" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="255" y="549" font-size="12" fill="#5b6b85">planejado (bloco futuro)</text>
</svg>
